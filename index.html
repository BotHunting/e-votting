        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%;

            background-color: #f8fafc;
        }
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f8fafc; /* Senada dengan background body */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        #loader p {
            margin-top: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #64748b;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #3b82f6; /* Biru */
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        main {
            height: 100%;
            width: 100%;
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>

<body>
    <!-- Pre-loader untuk meningkatkan skor FCP/LCP dan User Experience -->
    <div id="loader">
        <div class="spinner"></div>
        <p>Memuat sistem e-voting...</p>
    </div>

    <main>
        <!-- Fallback content untuk mesin pencari dan browser tanpa JavaScript -->
        <noscript>
            <h1>Sistem E-Voting Pemilihan Lokal</h1>
            <p>Sistem pemilihan digital berbasis web untuk pemilihan lokal di tingkat kelurahan/desa.</p>
            <p>Menggunakan <strong>Google Apps Script</strong> sebagai backend dan <strong>Google Sheets</strong> sebagai database, memberikan solusi yang aman, transparan, dan mudah diakses tanpa biaya server.</p>
            <h2>Fitur Utama:</h2>
            <ul>
                <li><strong>Multi-Election Support:</strong> Satu NIK dapat memilih di berbagai pemilihan berbeda (Kepala Desa, RW, RT, BPD)</li>
                <li><strong>CRUD Lengkap:</strong> Kelola kandidat dan DPT dengan fitur tambah, edit, dan hapus</li>
                <li><strong>Real-time Analytics:</strong> Grafik perolehan suara terpisah untuk setiap pemilihan</li>
                <li><strong>Aman & Transparan:</strong> LockService mencegah double vote, audit log lengkap</li>
                <li><strong>Anti-Double Vote:</strong> Validasi ganda per pemilihan, support multi-election</li>
            </ul>
            <p>Untuk pengalaman terbaik, silakan aktifkan JavaScript di browser Anda.</p>
        </noscript>

        <iframe title="Sistem E-Voting Pemilihan Lokal" src="https://script.google.com/macros/s/AKfycbwZQI9YGm_GLt0oQ25Qzan6kUubr0nAahoXlaqq8_bEQ6OLKmxjp19FNHyGt4L8_rzN/exec">
            Memuat Sistem E-Voting...
        </iframe>
    </main>

    <!-- Script untuk menyembunyikan pre-loader setelah iframe selesai dimuat -->
    <script>
        const iframe = document.querySelector('iframe');
        const loader = document.getElementById('loader');

        iframe.addEventListener('load', function() {
            // Sembunyikan loader dengan transisi
            loader.style.opacity = '0';
            // Hapus loader dari DOM setelah transisi selesai
            setTimeout(() => { loader.style.display = 'none'; }, 500); // Sesuaikan dengan durasi transisi CSS
        });
    </script>
